services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${APP_TIMEZONE:-Africa/Johannesburg}
    volumes:
      - monitor_db_data:/var/lib/postgresql/data
    # Deliberately NOT published to the host: only the app network may reach Postgres.
    # Also NOT attached to the shared proxy network: Nginx Proxy Manager must never
    # be able to reach the database. Internal to the "monitor" network only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monitor

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Stable container name: this becomes the DNS hostname on the shared
    # proxy network. Nginx Proxy Manager proxies to
    # http://clickcraft-monitor-app:4000
    container_name: clickcraft-monitor-app
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Optional direct host binding for local debugging/health checks.
      # When Nginx Proxy Manager reaches the app over the shared proxy
      # network (below), this binding is not required — remove this section
      # entirely if you don't need it. Never publish it publicly.
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-4000}:${APP_PORT:-4000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-4000}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      # Private internal network (app <-> db).
      - monitor
      # Shared external network with Nginx Proxy Manager. Only this service
      # joins it — the database and worker stay private.
      - proxy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      HOST_PROC_PATH: /host/proc
      HOST_ROOT_PATH: /host/root
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Read-only host visibility for VPS health metrics.
      - /proc:/host/proc:ro
      - /:/host/root:ro
      # OPTIONAL Docker container monitoring. Read-only socket mount.
      # Uncomment together with DOCKER_SOCKET_PATH=/var/run/docker.sock in .env.
      # Security note: see README — grants read access to the Docker API.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # Worker stays on the private network only — it serves no HTTP traffic
      # and must not be reachable from the proxy network.
      - monitor

volumes:
  monitor_db_data:

networks:
  # Private internal network: app + worker + db only. Not shared with anything else.
  monitor:
    driver: bridge
  # External network shared with Nginx Proxy Manager. Create it once on the VPS:
  #   docker network create npm-proxy
  # and attach NPM's compose stack to the same network. Only the "app" service
  # joins it; the database and worker are never exposed to it.
  # Override the name in .env with PROXY_NETWORK_NAME=<your-npm-network>.
  proxy:
    name: ${PROXY_NETWORK_NAME:-npm-proxy}
    external: true
